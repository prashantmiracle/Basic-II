version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fashion
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
  api:
    build: ./apps/api
    env_file: .env.example
    volumes:
      - ./apps/api:/code
    depends_on:
      - db
      - redis
  worker:
    build: ./apps/api
    command: rq worker -u redis://redis:6379/0 default
    env_file: .env.example
    depends_on:
      - api
  scheduler:
    build: ./apps/api
    command: rqscheduler
    env_file: .env.example
    depends_on:
      - api
  web:
    build: ./apps/web
    env_file: .env.example
    volumes:
      - ./apps/web:/app
    depends_on:
      - api
  nginx:
    image: nginx:1.25
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - web
      - api
volumes:
  pgdata:
